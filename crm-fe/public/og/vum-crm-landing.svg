    <rect width="64" height="64" rx="14" fill="#07182B"/>
    <text x="32" y="44" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">V</text>
    
